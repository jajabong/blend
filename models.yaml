# Blend 终极统筹精算配置 (v2.3.0)
# 核心原则：短回答走 Baosi(按量)，长回答走 Lemon(按次)，兜底走 Minimax(免费)

tiers:
  # --- Baosi (按 Token 计费: 适合精准、短回答) ---
  haiku:
    provider: BaosiProvider
    model_name: "claude-haiku-4-5-20251001"
    tier: L3_LIGHT
    cost_per_1k: 0.003
    fallback: [gemini, minimax]

  sonnet:
    provider: BaosiProvider
    model_name: "claude-sonnet-4-6"
    tier: L3_MAIN
    cost_per_1k: 0.015
    fallback: [gemini_pro, gemini, minimax]

  opus:
    provider: BaosiProvider
    model_name: "claude-opus-4-7"
    tier: L2_L5_HIGH
    cost_per_1k: 0.075
    fallback: [gemini_pro_ultra, sonnet]

  # --- Lemon (按次计费: 适合长文、重型推理、画图) ---
  gemini:
    provider: LemonProvider
    model_name: "[L]gemini-3-flash-preview"
    tier: L3_BATCH
    cost_per_1k: 0.0014 # 映射 1.4 额度
    fallback: [minimax]

  gemini_pro:
    provider: LemonProvider
    model_name: "[L]gemini-3-pro-preview"
    tier: L3_BATCH_PRO
    cost_per_1k: 0.00875 # 按次 8.75 额度
    fallback: [gemini_pro_ultra, minimax]
      
  gemini_pro_ultra:
    provider: LemonProvider
    model_name: "[L]gemini-3.1-pro-preview"
    tier: L2_L5_HIGH
    cost_per_1k: 0.0105 # 按次 10.5 额度
    fallback: [minimax]

  gemini_image_flash:
    provider: LemonProvider
    model_name: "[L]gemini-3.1-flash-image-preview"
    tier: SPECIALIZED
    cost_per_1k: 0.031 # 映射 31 额度

  gemini_image_pro:
    provider: LemonProvider
    model_name: "[L]gemini-3-pro-image-preview"
    tier: SPECIALIZED
    cost_per_1k: 0.085 # 映射 85 额度

  # --- Minimax (基础代谢: 几乎免费) ---
  minimax:
    provider: MinimaxProvider
    model_name: "MiniMax-M2.7"
    tier: L1_L4
    cost_per_1k: 0.001

# 统筹逻辑路由
complexity_routing:
  low:
    primary: haiku
  medium:
    primary: sonnet
  high:
    primary: gemini_pro_ultra

# 专项任务强制路由
gemini_task_types:
  - deep_reasoning
  - image_generation
  - multimodal
