services:
  blend:
    build: .
    container_name: blend-api
    ports:
      - "8080:8080"
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - BAOSI_API_KEY=${BAOSI_API_KEY}
      - LEMON_API_KEY=${LEMON_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
